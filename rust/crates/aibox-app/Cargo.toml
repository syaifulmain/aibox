[package]
name = "aibox-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "aibox_app"
path = "src/lib.rs"

[[bin]]
name = "aibox"
path = "src/main.rs"
test = false

[[test]]
name = "backend_qobject"
path = "tests/backend_qobject.rs"
harness = false

[[test]]
name = "qml_smoke"
path = "tests/qml_smoke.rs"
harness = false

[features]
dev-gallery = []

[dependencies]
aibox-core = { path = "../aibox-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
libc = "0.2"
notify = "8"
serde = "1"
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
