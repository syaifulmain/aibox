<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>AIBox</title>
  <desc>A dark rounded container frame holding a minimal terminal prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252837"/>
      <stop offset="1" stop-color="#13151d"/>
    </linearGradient>
    <linearGradient id="squircleRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48506e"/>
      <stop offset="1" stop-color="#222636"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc2ff"/>
      <stop offset="0.55" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#5874b8"/>
    </linearGradient>
    <linearGradient id="chevron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6cbff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>

  <!-- App background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="url(#squircleRim)" stroke-width="3"/>

  <!-- Hard shadow + isolated container box -->
  <rect x="92" y="132" width="328" height="260" rx="44" fill="#090a0f"/>
  <rect x="92" y="124" width="328" height="260" rx="44" fill="#10121a" stroke="url(#frame)" stroke-width="10"/>

  <!-- Terminal prompt >_ -->
  <path d="M170 212 L228 254 L170 296" fill="none" stroke="url(#chevron)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="258" y1="296" x2="344" y2="296" stroke="#eef2ff" stroke-width="26" stroke-linecap="round"/>
</svg>
